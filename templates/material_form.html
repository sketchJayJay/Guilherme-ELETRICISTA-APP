{% extends 'base.html' %}{% block content %}
<div class="page-head"><div><h1>{{ 'Editar material' if material else 'Novo material' }}</h1><p>Estoque mínimo gera alerta no painel.</p></div></div>
<form method="post" class="card"><div class="card-body form-grid"><div class="field full"><label>Nome *</label><input class="input" name="name" required value="{{ material.name if material else '' }}"></div><div class="field"><label>Unidade</label><select class="select" name="unit">{% for x in ['un','m','rolo','cx','kg','kit'] %}<option {% if material and material.unit==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div>{% if not material %}<div class="field"><label>Estoque inicial</label><input class="input" name="stock_qty" value="0"></div>{% endif %}<div class="field"><label>Estoque mínimo</label><input class="input" name="min_stock" value="{{ material.min_stock if material else '0' }}"></div><div class="field"><label>Custo unitário</label><input class="input" name="unit_cost" value="{{ material.unit_cost if material else '0' }}"></div><div class="field"><label>Preço de venda</label><input class="input" name="sale_price" value="{{ material.sale_price if material else '0' }}"></div><div class="field full"><label>Observações</label><textarea class="textarea" name="notes">{{ material.notes if material else '' }}</textarea></div><div class="field full"><div class="actions"><button class="btn primary" type="submit">Salvar</button><a class="btn" href="{{ url_for('materials') }}">Cancelar</a>{% if material and material.id %}<button class="btn danger" type="submit" formnovalidate formaction="{{ url_for('material_delete', material_id=material.id) }}" formmethod="post" onclick="return confirmDelete('Excluir este material? Se ele já foi usado, o sistema preserva o histórico e bloqueia a exclusão.')">Excluir material</button>{% endif %}</div></div></div></form>
{% endblock %}

{% extends 'base.html' %}{% block content %}
<div class="page-head"><div><h1>{{ 'Editar cliente' if client else 'Novo cliente' }}</h1><p>Deixe o contato e o local do serviço prontos para usar na agenda.</p></div></div>
<form method="post" class="card"><div class="card-body form-grid">
<div class="field full"><label>Nome *</label><input class="input" name="name" required value="{{ client.name if client else '' }}"></div>
<div class="field"><label>Telefone / WhatsApp</label><input class="input" name="phone" placeholder="(28) 99999-9999" value="{{ client.phone if client else '' }}"></div>
<div class="field"><label>CPF / CNPJ</label><input class="input" name="cpf_cnpj" value="{{ client.cpf_cnpj if client else '' }}"></div>
<div class="field"><label>E-mail</label><input class="input" type="email" name="email" value="{{ client.email if client else '' }}"></div>
<div class="field"><label>Cidade</label><input class="input" name="city" value="{{ client.city if client else '' }}"></div>
<div class="field full"><label>Endereço</label><input class="input" name="address" value="{{ client.address if client else '' }}"></div>
<div class="field full"><label>Referência / localização</label><input class="input" name="reference" placeholder="Ex.: casa azul ao lado do mercado" value="{{ client.reference if client else '' }}"></div>
<div class="field full"><label>Observações</label><textarea class="textarea" name="notes">{{ client.notes if client else '' }}</textarea></div>
<div class="field full"><div class="actions"><button class="btn primary" type="submit">Salvar cliente</button><a class="btn" href="{{ url_for('clients') }}">Cancelar</a>{% if client and client.id %}<button class="btn danger" type="submit" formnovalidate formaction="{{ url_for('client_delete', client_id=client.id) }}" formmethod="post" onclick="return confirmDelete('Excluir este cliente? Se houver serviços ou orçamentos, o histórico será protegido.')">Excluir cliente</button>{% endif %}</div></div>
</div></form>{% endblock %}

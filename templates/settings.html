{% extends 'base.html' %}{% block content %}
<div class="page-head"><div><h1>Configurações</h1><p>Dados que aparecem nas ordens de serviço e orçamentos.</p></div></div>
<form method="post" class="card"><div class="card-body form-grid"><div class="field full"><label>Nome da empresa</label><input class="input" name="business_name" value="{{ settings.business_name }}"></div><div class="field"><label>Nome do profissional</label><input class="input" name="owner_name" value="{{ settings.owner_name }}"></div><div class="field"><label>Cidade</label><input class="input" name="city" value="{{ settings.city }}"></div><div class="field"><label>Telefone</label><input class="input" name="phone" value="{{ settings.phone }}"></div><div class="field"><label>WhatsApp</label><input class="input" name="whatsapp" value="{{ settings.whatsapp }}"></div><div class="field"><label>Chave Pix</label><input class="input" name="pix_key" value="{{ settings.pix_key }}"></div><div class="field"><label>Valor padrão por hora</label><input class="input" name="hourly_rate" value="{{ settings.hourly_rate }}"></div><div class="field full"><label>Rodapé dos documentos</label><input class="input" name="footer_text" value="{{ settings.footer_text }}"></div><div class="field"><label>Usuário de acesso</label><input class="input" name="username" value="{{ user.username }}"></div><div class="field"><label>Nova senha</label><input class="input" type="password" name="password" placeholder="Deixe vazio para manter"></div><div class="field full"><button class="btn primary" type="submit">Salvar configurações</button></div></div></form>
<div class="card" style="margin-top:18px"><div class="card-head"><h2>Backup</h2></div><div class="card-body"><p class="muted">Baixe uma cópia completa do banco de dados. Guarde esse arquivo em outro lugar de tempos em tempos.</p><a class="btn" href="{{ url_for('backup_download') }}">⬇ Baixar backup agora</a></div></div>
{% endblock %}

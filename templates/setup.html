<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primeiro acesso</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20260828-stable1"></head><body class="auth-page"><div class="auth-card"><img class="auth-brand-logo" src="{{ url_for('static', filename='brand-logo.png') }}" alt="Guilherme Elétrica e Climatização"><h1>Primeiro acesso</h1><p>Configure o sistema uma única vez.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{ cat }}" style="margin-bottom:12px">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post" class="form-grid"><div class="field full"><label>Nome da empresa</label><input class="input" name="business_name" value="Guilherme Elétrica e Climatização"></div><div class="field full"><label>Nome do profissional</label><input class="input" name="owner_name" value="Guilherme"></div><div class="field"><label>Usuário</label><input class="input" name="username" required></div><div class="field"><label>Senha</label><input class="input" type="password" name="password" minlength="4" required></div><div class="field full"><button class="btn primary" type="submit">Criar acesso e entrar</button></div></form></div></body></html>

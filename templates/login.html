<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="auth-page"><div class="auth-card"><div class="auth-logo">⚡</div><h1>{{ app_settings.business_name }}</h1><p>Acesse sua agenda, clientes e financeiro.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{ cat }}" style="margin-bottom:12px">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post" class="grid"><div class="field"><label>Usuário</label><input class="input" name="username" autofocus required></div><div class="field"><label>Senha</label><input class="input" type="password" name="password" required></div><button class="btn primary" type="submit">Entrar</button></form></div></body></html>
